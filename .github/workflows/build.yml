name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and run the test suite
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Generate the Javadoc
        run: mvn --batch-mode --no-transfer-progress javadoc:javadoc

      - name: Upload the runnable jar
        uses: actions/upload-artifact@v4
        with:
          name: avatar-battle-for-freedom
          path: target/avatar-battle-for-freedom.jar
          if-no-files-found: error
