name: javadoc

# Genera el Javadoc y lo publica en GitHub Pages en cada cambio de main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan varios cambios seguidos, se publica el ultimo y se cancelan los
# anteriores, en lugar de encolarlos.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Generate the Javadoc
        run: mvn --batch-mode --no-transfer-progress javadoc:javadoc

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the generated documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/apidocs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
