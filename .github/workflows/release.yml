name: release

# Publica una version del juego cuando se sube una etiqueta tipo v1.0.0:
# compila, pasa las pruebas y adjunta el jar ejecutable a la release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and run the test suite
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Create the release and attach the jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/avatar-battle-for-freedom.jar \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
